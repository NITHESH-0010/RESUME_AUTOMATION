services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/service-account.json
      GOTENBERG_URL: http://gotenberg:3000
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    depends_on:
      - gotenberg
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
