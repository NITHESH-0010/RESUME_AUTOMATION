services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    depends_on:
      - gotenberg
    restart: unless-stopped

  gotenberg:
    image: gotenberg/gotenberg:8
    restart: unless-stopped
    # No ports published — only the "app" service talks to it, over the
    # internal docker-compose network at http://gotenberg:3000
