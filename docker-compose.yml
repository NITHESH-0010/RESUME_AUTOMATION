services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Override .env's local-run default for the containerized network.
      GOOGLE_SERVICE_ACCOUNT_FILE: /app/service-account.json
    volumes:
      - ./service-account.json:/app/service-account.json:ro
    restart: unless-stopped
